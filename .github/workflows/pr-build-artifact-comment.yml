name: PR Build Artifact Comment

on:
  workflow_run:
    workflows:
      - PR Build Artifact
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  comment:
    name: Comment artifact link
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          marker='<!-- pr-build-artifact-comment -->'
          artifact_info="$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            --paginate \
            --jq '.artifacts[] | select(.name | test("^dist-pr-[1-9][0-9]*$")) | "\(.id) \(.name)"' \
            | head -n 1)"

          if [ -z "${artifact_info}" ]; then
            echo "Could not find a PR build artifact."
            exit 1
          fi

          read -r artifact_id artifact_name <<< "${artifact_info}"
          pr_number="${artifact_name#dist-pr-}"
          pr_info="$(gh api "repos/${REPOSITORY}/pulls/${pr_number}" \
            --jq '[.base.repo.full_name, .head.sha] | @tsv')"
          read -r base_repository pr_head_sha <<< "${pr_info}"

          if [ "${base_repository}" != "${REPOSITORY}" ] || [ "${pr_head_sha}" != "${HEAD_SHA}" ]; then
            echo "Artifact PR does not match the completed workflow run."
            exit 1
          fi

          PR_NUMBER="${pr_number}"

          artifact_url="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts/${artifact_id}"
          body="$(printf '%s\n%s\n\n%s\n%s\n\n%s' \
            "${marker}" \
            "PR 빌드가 완료되었습니다." \
            "- 다운로드: [${artifact_name}.zip](${artifact_url})" \
            "- 빌드 로그: [${RUN_NAME} #${RUN_NUMBER}](${RUN_URL})" \
            "아티팩트는 7일 후 만료됩니다.")"

          existing_comment_id="$(gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq ".[] | select(.user.type == \"Bot\" and (.body | contains(\"${marker}\"))) | .id" \
            | head -n 1)"

          if [ -n "${existing_comment_id}" ]; then
            gh api \
              --method PATCH \
              "repos/${REPOSITORY}/issues/comments/${existing_comment_id}" \
              -f body="${body}"
          else
            gh api \
              --method POST \
              "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="${body}"
          fi
